# Builds the Windows installer (NSIS) and portable exe on every push and PR,
# after tests, typecheck and the audit. Tags matching v* also attach both files
# to a GitHub Release. Unsigned: Windows SmartScreen will warn on first run.
name: Build Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run audit
      - run: npm run build

      - name: Package (unsigned)
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Chronos-windows
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Chronos ${{ github.ref_name }}
          body: Download Chronos-Setup-*.exe to install, or Chronos-Portable-*.exe to run without installing. Unsigned build; SmartScreen shows More info -> Run anyway.
          files: |
            release/Chronos-Setup-*.exe
            release/Chronos-Portable-*.exe
          fail_on_unmatched_files: true
