# Builds the Windows installer (NSIS) and portable exe on every push and PR,
# after tests, typecheck and the audit. Every push to main stamps version 1.0.<run number>
# and publishes a GitHub Release (v1.0.N) that the installed app auto-updates from
# (latest.yml + blockmap). Tags matching v* also release. Unsigned: SmartScreen will warn.
name: Build Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run audit

      - name: Stamp version (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version

      - run: npm run build

      - name: Package (unsigned)
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Chronos-windows
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Release (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Chronos 1.0.${{ github.run_number }}
          body: Download Chronos-Setup-*.exe to install (it auto-updates), or Chronos-Portable-*.exe to run without installing (no auto-update). Unsigned build; SmartScreen shows More info -> Run anyway.
          files: |
            release/Chronos-Setup-*.exe
            release/Chronos-Portable-*.exe
            release/latest.yml
            release/*.blockmap
          fail_on_unmatched_files: true

      - name: Release (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Chronos ${{ github.ref_name }}
          body: Download Chronos-Setup-*.exe to install, or Chronos-Portable-*.exe to run without installing. Unsigned build; SmartScreen shows More info -> Run anyway.
          files: |
            release/Chronos-Setup-*.exe
            release/Chronos-Portable-*.exe
            release/latest.yml
            release/*.blockmap
          fail_on_unmatched_files: true
