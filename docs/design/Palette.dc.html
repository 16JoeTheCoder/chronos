<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette and quick add</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF5B1F}a:hover{color:#FF7A47}
</style>
</helmet>
<div style="width: 1440px; height: 900px; background: rgba(8,9,10,0.92); font-family: 'Space Grotesk', system-ui, sans-serif; color: #F3F2EE; display: flex; justify-content: center; padding-top: 160px; box-sizing: border-box">
<div style="width: 680px; align-self: flex-start; background: #16181B; border: 1px solid #2A2D32; border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.6); overflow: hidden">
<div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #2A2D32">
<label for="qa" style="font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #8D9198">Add or search</label>
<div id="qa" style="font-size: 22px; line-height: 1.5">teach <span style="background: rgba(255,91,31,0.16); border-bottom: 2px solid #FF5B1F; padding: 0 2px">coding class</span> <span style="background: rgba(86,180,233,0.16); border-bottom: 2px solid #56B4E9; padding: 0 2px">thu 4pm to 6pm</span><span style="display: inline-block; width: 2px; height: 24px; background: #FF5B1F; vertical-align: middle; margin-left: 2px"></span></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #FF5B1F; color: #FF5B1F">Fixed event</span>
<span style="font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #56B4E9; color: #56B4E9">Thu 12 Nov · 16:00 to 18:00</span>
<span style="font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #7B8088; color: #A9ADB3">Coding club</span>
</div>
</div>
<div style="padding: 8px">
<div style="padding: 12px 16px; border-radius: 8px; background: #1D2024; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px; font-weight: 500">Add fixed event</span>
<span style="font-size: 12px; font-family: 'JetBrains Mono', monospace; color: #8D9198">Enter</span>
</div>
<div style="padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; color: #A9ADB3">
<span style="font-size: 14px">Add as a task instead</span>
<span style="font-size: 12px; font-family: 'JetBrains Mono', monospace; color: #8D9198">Shift+Enter</span>
</div>
<div style="padding: 8px 16px 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #8D9198">Matches</div>
<div style="padding: 12px 16px; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px">Coding club: lesson 3 slides</span>
<span style="font-size: 12px; color: #8D9198">task · Fri</span>
</div>
<div style="padding: 12px 16px; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px">Coding club week plan</span>
<span style="font-size: 12px; color: #8D9198">note</span>
</div>
</div>
<div style="padding: 12px 24px; border-top: 1px solid #2A2D32; font-size: 11px; color: #8D9198; font-family: 'JetBrains Mono', monospace; display: flex; justify-content: space-between">
<span>Backspace on a chip undoes that guess</span>
<span>&gt; for commands</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
