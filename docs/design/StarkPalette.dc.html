<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask JARVIS palette</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&amp;family=Sora:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4FD8FF}a:hover{color:#A6ECFF}
::selection{background:#4FD8FF;color:#03060B}
.stk-btn{transition:background 160ms cubic-bezier(.16,1,.3,1),border-color 160ms}
.stk-btn:hover{background:rgba(79,216,255,0.14);border-color:#4FD8FF}
.stk-btn:focus-visible,.stk-tog:focus-visible{outline:2px solid #A6ECFF;outline-offset:2px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; background: radial-gradient(circle at 50% 30%, rgba(79,216,255,0.12), rgba(3,6,11,0.97) 60%), #03060B; font-family: Sora, system-ui, sans-serif; color: #CFE9F5; display: flex; justify-content: center; padding-top: 150px; box-sizing: border-box">
<div style="width: 720px; align-self: flex-start; border-radius: 18px; border: 1px solid rgba(79,216,255,0.45); background: rgba(5,12,20,0.96); box-shadow: 0 24px 60px rgba(0,0,0,0.55); overflow: hidden">
<div style="padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid rgba(79,216,255,0.18)">
<label for="jv" style="font-size: 13px; color: #7FA3B5">Ask JARVIS, add a task or search</label>
<div id="jv" style="font-size: 24px; line-height: 1.4; color: #F2FBFF">teach <span style="border-bottom: 2px solid #4FD8FF; background: rgba(79,216,255,0.12); padding: 0 3px">coding class</span> <span style="border-bottom: 2px solid #FFB547; background: rgba(255,181,71,0.12); padding: 0 3px">thu 4pm to 6pm</span><span aria-hidden="true" style="display: inline-block; width: 2px; height: 26px; background: #4FD8FF; vertical-align: middle; margin-left: 3px"></span></div>
<div style="display: flex; gap: 8px">
<span style="font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid #4FD8FF; color: #4FD8FF">Fixed event</span>
<span style="font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid #FFB547; color: #FFB547">Thu 12 Nov, 16:00 to 18:00</span>
</div>
</div>
<div style="padding: 10px">
<div style="padding: 14px 18px; border-radius: 10px; background: rgba(79,216,255,0.12); display: flex; justify-content: space-between"><span style="font-size: 15px; color: #F2FBFF">Add fixed event</span><span style="font-size: 13px; color: #7FA3B5">Enter</span></div>
<div style="padding: 14px 18px; display: flex; justify-content: space-between"><span style="font-size: 15px">Add as a task instead</span><span style="font-size: 13px; color: #7FA3B5">Shift Enter</span></div>
<div style="padding: 14px 18px; display: flex; justify-content: space-between"><span style="font-size: 15px">Ask Claude: “plan my Thursday around this”</span><span style="font-size: 13px; color: #7FA3B5">Tab</span></div>
<div style="padding: 14px 18px; display: flex; justify-content: space-between; color: #9FC3D4"><span style="font-size: 15px">Coding club: lesson 3 slides</span><span style="font-size: 13px">Task, Friday</span></div>
</div>
</div>
</div>
</x-dc>

</html>
