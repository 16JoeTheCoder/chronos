<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Living reactor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&amp;family=Sora:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
::selection{background:#4FD8FF;color:#03060B}
button:focus-visible{outline:2px solid #A6ECFF;outline-offset:2px}

@property --sw{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes lr-spin{to{--sw:360deg}}
@keyframes lr-breathe{0%,100%{transform:scale(.94);filter:brightness(.9)}50%{transform:scale(1.04);filter:brightness(1.25)}}
@keyframes lr-flare{0%{transform:scale(1);opacity:.95}100%{transform:scale(2.4);opacity:0}}
.lr-plasma{background:conic-gradient(from var(--sw),rgba(79,216,255,.0),rgba(79,216,255,.55),rgba(166,236,255,.95),rgba(79,216,255,.55),rgba(79,216,255,0));animation:lr-spin 6s linear infinite}
.lr-core{animation:lr-breathe 3.2s ease-in-out infinite}
.lr-flare{animation:lr-flare 900ms cubic-bezier(.16,1,.3,1) forwards}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; background: #03060B radial-gradient(circle at 50% 45%, rgba(79,216,255,0.12), rgba(3,6,11,0) 60%); font-family: Sora, system-ui, sans-serif; color: #CFE9F5; position: relative; overflow: hidden"><div style="position: absolute; left: 48px; top: 40px; display: flex; flex-direction: column; gap: 6px; max-width: 460px"><h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-size: 30px; font-weight: 600; color: #F2FBFF">Living reactor</h1><p style="margin: 0; font-size: 14px; line-height: 1.55; color: #9FC3D4">A plasma core turns inside the ring and breathes; it burns brighter as the block progresses. Completing fires one flare. Sound cues would play here: a soft rising tone on start, a chord on finish.</p></div>
<div style="position: absolute; left: 50%; top: 52%; width: 520px; height: 520px; transform: translate(-50%,-50%)">
<div class="lr-plasma" style="position: absolute; inset: 60px; border-radius: 50%; mask: radial-gradient(circle, transparent 57%, #000 58%, #000 70%, transparent 71%); -webkit-mask: radial-gradient(circle, transparent 57%, #000 58%, #000 70%, transparent 71%)"></div>
<div class="lr-core" style="{{ coreStyle }}"></div>
<sc-if value="{{ flare }}" hint-placeholder-val="{{ false }}"><div class="lr-flare" style="position: absolute; inset: 140px; border-radius: 50%; border: 3px solid #A6ECFF"></div></sc-if>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><span style="font-family: 'Chakra Petch', sans-serif; font-size: 72px; font-weight: 600; color: #F2FBFF">{{ clock }}</span><span style="font-size: 15px; color: #CFE9F5">Blade pitch model</span></div>
</div>
<div style="position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%); display: flex; gap: 12px">
<button onClick="{{ less }}" style="height: 48px; padding: 0 22px; border-radius: 12px; font: 600 15px 'Chakra Petch', sans-serif; cursor: pointer; border: 1px solid rgba(79,216,255,0.4); background: transparent; color: #CFE9F5">Earlier in block</button>
<button onClick="{{ more }}" style="height: 48px; padding: 0 22px; border-radius: 12px; font: 600 15px 'Chakra Petch', sans-serif; cursor: pointer; border: 1px solid rgba(79,216,255,0.4); background: transparent; color: #CFE9F5">Later in block</button>
<button onClick="{{ finish }}" style="height: 48px; padding: 0 22px; border-radius: 12px; font: 600 15px 'Chakra Petch', sans-serif; cursor: pointer; border: none; background: #4FD8FF; color: #03060B">Complete (flare)</button>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p){super(p);this.state={pct:54,flare:false,n:0};}
renderVals(){const s=this.state;const k=0.25+s.pct/100*0.75;const left=Math.round(90*(1-s.pct/100));
return{flare:s.flare,clock:left+':00',
coreStyle:'position: absolute; inset: 170px; border-radius: 50%; background: radial-gradient(circle, rgba(166,236,255,'+k.toFixed(2)+') 0%, rgba(79,216,255,'+(k*0.5).toFixed(2)+') 45%, rgba(3,6,11,0) 72%)',
less:()=>this.setState({pct:Math.max(5,s.pct-20),flare:false}),more:()=>this.setState({pct:Math.min(98,s.pct+20),flare:false}),
finish:()=>{this.setState({flare:false});setTimeout(()=>this.setState({flare:true,pct:100}),20);}};}
}
</script>
</body>
</html>
